# Publishes a release from a version tag. VerBump bumps the version, writes
# CHANGELOG.md, commits, tags vX.Y.Z and pushes; this workflow does the rest.
# It tests the tagged commit, creates the GitHub release with the tag's
# CHANGELOG section as its body, and publishes the package to npm with
# provenance. npm accepts the publish through its trusted publisher for this
# workflow, so no npm token is stored anywhere. RELEASING.md gives the whole
# flow and the trusted publisher setup.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# One release per tag at a time, and never cancel a publish part way.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, create the GitHub release and publish to npm
    runs-on: ubuntu-latest
    permissions:
      # gh release create needs to write the release.
      contents: write
      # npm publish trades the workflow's OIDC token for a short-lived npm
      # token through the trusted publisher, and signs the provenance with it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Trusted publishing needs npm 11.5.1 or later. Node 24 bundles npm 11,
      # as in npm's own example workflow, so the job uses Node 24 rather than
      # upgrading npm in place on Node 22, whose bundled npm is 10.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Points npm at the public registry. The publish step stores and
          # reads no token: npm gets one from the trusted publisher.
          registry-url: https://registry.npmjs.org
      # Fails before anything is public when the bundled npm is too old for
      # trusted publishing.
      - name: Check that npm is 11.5.1 or later
        run: |
          version=$(npm --version)
          echo "npm ${version}"
          if ! printf '%s\n' 11.5.1 "${version}" | sort -V -C; then
            echo "::error::Trusted publishing needs npm 11.5.1 or later, but the job has npm ${version}."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but package.json has version ${version}."
            exit 1
          fi
      # Clear dist/ first, so the package holds only what this build writes.
      # pnpm test builds dist/, then tests it.
      - run: rm -rf dist && pnpm test
      # Fails when CHANGELOG.md has no section for the tag, before anything
      # is public.
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${GITHUB_REF_NAME}" CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
      # A rerun after a failed publish finds the release already there.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "The GitHub release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
      # A direct publish, not npm stage publish. Trusted publishing adds
      # provenance by itself. --provenance stays, so that the command says
      # that it publishes with provenance.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
