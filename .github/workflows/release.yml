# Publishes a release from a version tag. VerBump bumps the version, writes
# CHANGELOG.md, commits, tags vX.Y.Z or vX.Y.Z-<pre-release> and pushes; this
# workflow does the rest. It tests the tagged commit, creates the GitHub
# release with the tag's CHANGELOG section as its body, and publishes the
# package to npm with provenance. A full tag publishes as latest. A
# pre-release tag such as v1.0.0-rc.1 publishes under the dist-tag next, as a
# GitHub pre-release, so latest moves only on a full release (docs/adr/0001).
# npm accepts the publish through its trusted publisher for this workflow, so
# no npm token is stored anywhere. RELEASING.md gives the whole flow and the
# trusted publisher setup.
name: release

on:
  push:
    # A full tag, and a pre-release tag. GitHub's `*` takes any run of
    # characters but `/`, so scripts/release-tag.js checks the pre-release
    # part in the job, before anything is public.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

# One release per tag at a time, and never cancel a publish part way.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, create the GitHub release and publish to npm
    runs-on: ubuntu-latest
    permissions:
      # gh release create needs to write the release.
      contents: write
      # npm publish trades the workflow's OIDC token for a short-lived npm
      # token through the trusted publisher. The provenance is signed with
      # the same OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Trusted publishing needs npm 11.5.1 or later. Recent Node 24 releases
      # bundle it, and npm's own example workflow uses Node 24, so the job
      # uses Node 24 rather than upgrading npm in place on Node 22, whose
      # bundled npm is 10. The next step checks the npm that Node 24 brings.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes an .npmrc for the public registry, with a token line that
          # setup-node fills with a placeholder. The workflow passes no npm
          # token. npm tries the trusted publisher first, and signs in there.
          registry-url: https://registry.npmjs.org
      # Fails before anything is public when the bundled npm is too old for
      # trusted publishing.
      - name: Check that npm is 11.5.1 or later
        env:
          MINIMUM_NPM: 11.5.1
        run: |
          npm_version=$(npm --version)
          echo "npm ${npm_version}"
          if ! printf '%s\n' "${MINIMUM_NPM}" "${npm_version}" | sort -V -C; then
            echo "::error::Trusted publishing needs npm ${MINIMUM_NPM} or later, but the job has npm ${npm_version}."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but package.json has version ${version}."
            exit 1
          fi
      # Writes prerelease=true or prerelease=false for the release and publish
      # steps. Fails for a tag that only looks like a version, such as
      # v1.0.0-rc.1+build.5.
      - name: Read whether the tag is a pre-release
        id: tag
        run: node scripts/release-tag.js "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
      # Clear dist/ first, so the package holds only what this build writes.
      # pnpm test builds dist/, then tests it.
      - run: rm -rf dist && pnpm test
      # Fails when CHANGELOG.md has no section for the tag, before anything
      # is public.
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${GITHUB_REF_NAME}" CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
      # A rerun after a failed publish finds the release already there. A
      # pre-release tag makes a GitHub pre-release, which the releases page
      # marks as such and never shows as the latest release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "The GitHub release ${GITHUB_REF_NAME} already exists."
          elif [ "${PRERELEASE}" = true ]; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --prerelease \
              --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
      # A direct publish, not npm stage publish. Trusted publishing adds
      # provenance by itself. --provenance stays, so that the command says
      # that it publishes with provenance. A pre-release goes under the
      # dist-tag next, so that `npm install @jv-k/claude-gauge` still gets the
      # latest full release. A full release takes npm's default dist-tag,
      # latest.
      - name: Publish to npm with provenance
        env:
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [ "${PRERELEASE}" = true ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
