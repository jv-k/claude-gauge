name: Bug report
description: A bar shows something wrong, shows nothing, or breaks a turn.
labels: [bug, needs-triage]
body:
  - type: dropdown
    id: line
    attributes:
      label: Which line
      options:
        - Status line
        - Token line
        - Both
        - Setup or install
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the line printed, or what went wrong. Paste the output as plain text.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The command from your settings
      description: The `command` of the `statusLine` or hook entry in `~/.claude/settings.json`.
      placeholder: node ~/.claude/claude-gauge/dist/statusline.js --show ctx,5h,7d
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Where you run Claude Code
      options:
        - Terminal CLI
        - VS Code extension
        - Desktop app
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: claude-gauge version
      description: The output of `git -C ~/.claude/claude-gauge rev-parse --short HEAD`, or the release tag.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `claude --version` and `node --version`, and your operating system.
      render: text
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: For the status line, a sample of the JSON input that shows the problem helps most. Remove secrets and private text first.
    validations:
      required: false
